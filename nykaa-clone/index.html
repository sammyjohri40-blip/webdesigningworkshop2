<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nykaa Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">NYKAA</div>

        <div class="cart">
            Cart 🛒 <span id="cart-count">0</span>
        </div>
    </header>

    <section class="hero">
        <h1>Beauty. Fashion. Lifestyle.</h1>
        <p>India's Favorite Beauty Destination</p>
    </section>

    <main class="container">

        <input
            type="text"
            id="search"
            placeholder="Search Products..."
            class="search-box"
        >

        <h2>Featured Products</h2>

        <div id="products" class="products"></div>

        <section class="form-section">

            <h2>Join Nykaa Membership</h2>

            <form id="registerForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Enter Name"
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                >

                <button type="submit">
                    Register
                </button>

            </form>

            <p id="message"></p>

        </section>

    </main>

    <footer>
        © 2025 Nykaa Clone Project
    </footer>

    <script src="script.js"></script>

</body>
</html>
